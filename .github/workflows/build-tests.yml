name: Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      test_path: 'test'
      # test_e2e.py spawns the real ffplay binary as the CLI player; runners
      # are headless (no sound card), so give SDL a dummy audio backend to
      # attach to.
      system_deps: 'ffmpeg'
      test_env: 'SDL_AUDIODRIVER=dummy'
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 (the MediaBackend v2
      # release) is on PyPI: install the v2 template from its feature
      # branch so PlaybackEvent/report() resolve during install.
      pre_install_pip: 'git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2'
