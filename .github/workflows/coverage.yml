name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovos_media_plugin_simple'
      test_path: 'test/'
      install_extras: '.[test]'
      min_coverage: 0
      system_deps: 'ffmpeg'
      # TEMPORARY until ovos-plugin-manager 3.0.0a1 (the MediaBackend v2
      # release) is on PyPI: install the v2 template from its feature
      # branch, else coverage installs v1 OPM from PyPI and dies on
      # ImportError PlaybackEvent.
      pre_install_pip: 'git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/media-backend-v2'
