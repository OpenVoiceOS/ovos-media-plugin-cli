[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-plugin-simple"
dynamic = ["version"]
description = "simple OCP plugin for ovos"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["ovos", "audio", "OCP", "plugin"]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-media-plugin-simple"

[project.entry-points."opm.media.audio"]
ovos-media-audio-plugin-simple = "ovos_media_plugin_simple:SimpleAudioService"

# legacy ovos-audio service backend (so the plugin works on both stacks)
[project.entry-points."mycroft.plugin.audioservice"]
ovos_simple = "ovos_media_plugin_simple.audio"

[tool.setuptools.dynamic]
version = { attr = "ovos_media_plugin_simple.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_media_plugin_simple*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.voc", "*.intent", "*.dialog"]
